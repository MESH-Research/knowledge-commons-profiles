{% if profile.show_badges %}
  {% with badges=profile.ordered_badges %}
    {% if badges %}
      <div class="content-card" id="badges">
        <h3 class="card-title">Badges</h3>

        <div class="card-body">
          <div class="profile-badges">
            {% for badge in badges %}
              <img src="{{ badge.image.url }}"
                   alt="{{ badge.alt_text }}"
                   title="{{ badge.title }}"
                   class="profile-badge-image"
                   loading="lazy" />
            {% endfor %}
          </div>
        </div>
      </div>
    {% endif %}
  {% endwith %}
{% endif %}
